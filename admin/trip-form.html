        <a href="/admin/gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Galerija</a>

      </div>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:14px;">
          <button class="sidebar-toggle" aria-label="Otvori meni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-title" id="topbar-title">Dodaj vožnju</div>
        </div>
        <div class="topbar-user">
          <div class="user-meta"><div class="name" data-user-name>...</div><div class="role" data-user-role>...</div></div>
          <div class="user-avatar" data-user-avatar>--</div>
        </div>
      </header>

      <div class="admin-content">
        <div class="breadcrumb"><a href="/admin/trips">Vozni red</a> / <span id="breadcrumb-current">Dodaj vožnju</span></div>
        <div class="page-header">
          <h1 id="form-heading">Dodaj vožnju</h1>
        </div>

        <div class="panel">
          <div class="panel-body">
            <form id="trip-form" novalidate>
              <div class="form-grid">
                <div class="form-group">
                  <label for="route_number">Broj linije</label>
                  <input type="text" id="route_number" name="route_number" required placeholder="npr. PG-BD-101" />
                  <div class="field-error" data-error-for="route_number"></div>
                </div>
                <div class="form-group">
                  <label for="bus_type">Tip autobusa</label>
                  <select id="bus_type" name="bus_type">
                    <option value="Standardni">Standardni</option>
                    <option value="Premium">Premium</option>
                    <option value="Mini bus">Mini bus</option>
                  </select>
                  <div class="field-error" data-error-for="bus_type"></div>
                </div>

                <div class="form-group">
                  <label for="from_station_id">Polazna stanica</label>
                  <select id="from_station_id" name="from_station_id" required><option value="">Učitavanje...</option></select>
                  <div class="field-error" data-error-for="from_station_id"></div>
                </div>
                <div class="form-group">
                  <label for="to_station_id">Odredište</label>
                  <select id="to_station_id" name="to_station_id" required><option value="">Učitavanje...</option></select>
                  <div class="field-error" data-error-for="to_station_id"></div>
                </div>

                <div class="form-group">
                  <label for="departure_date">Datum</label>
                  <input type="date" id="departure_date" name="departure_date" required />
                  <div class="field-error" data-error-for="departure_date"></div>
                </div>
                <div class="form-group">
                  <label for="status">Status</label>
                  <select id="status" name="status">
                    <option value="AKTIVNA">Aktivna</option>
                    <option value="OTKAZANA">Otkazana</option>
                    <option value="ZAVRSENA">Završena</option>
                  </select>
                  <div class="field-error" data-error-for="status"></div>
                </div>

                <div class="form-group">
                  <label for="departure_time">Vrijeme polaska</label>
                  <input type="time" id="departure_time" name="departure_time" required />
                  <div class="field-error" data-error-for="departure_time"></div>
                </div>
                <div class="form-group">
                  <label for="arrival_time">Vrijeme dolaska</label>
                  <input type="time" id="arrival_time" name="arrival_time" required />
                  <div class="field-error" data-error-for="arrival_time"></div>
                </div>

                <div class="form-group">
                  <label for="price">Cijena (&euro;)</label>
                  <input type="number" id="price" name="price" min="0" step="0.5" required />
                  <div class="field-error" data-error-for="price"></div>
                </div>

                <div class="form-group full">
                  <label for="notes">Napomena (opciono)</label>
                  <textarea id="notes" name="notes" placeholder="npr. Vožnja otkazana zbog tehničkih razloga."></textarea>
                  <div class="field-error" data-error-for="notes"></div>
                </div>
              </div>

              <div style="display:flex; gap:12px; margin-top:10px;">
                <button type="submit" class="btn btn-primary" id="submit-btn">SAČUVAJ VOŽNJU</button>
                <a href="/admin/trips" class="btn btn-outline">Otkaži</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>

</body>
</html>
